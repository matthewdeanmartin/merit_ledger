[package]
name = "meritledger"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Household Buddhist practice ledger on an ESP32-S3, built on miniframework"
license = "MIT"
publish = false
default-run = "meritledger"
build = "build.rs"

[[bin]]
name = "meritledger"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "meritledger-s3"
path = "src/bin/s3.rs"
required-features = ["esp32"]

[features]
default = ["desktop"]
# The desktop server reaches HTTPS instances (Brevo, mastodon.social) with rustls.
desktop = ["miniframework/desktop-tls"]
esp32 = ["miniframework/esp32", "miniframework/coredump", "miniframework/public-ca", "dep:esp-idf-svc", "dep:embuild", "bundled-web"]
# Embed the Angular app (run `make web` first).
bundled-web = []
# Transports (`make firmware TRANSPORT=...`): plain HTTP is always served;
# `https` adds TLS, `http2` adds HTTP/2 over it. The phone timer needs a
# secure context (Wake Lock), so the board ships with HTTPS.
https = ["miniframework/tls"]
http2 = ["https", "miniframework/http2"]
# Sprint 1 hardware gate: outbound HTTPS and SD load generators on the
# board. Never in a release build.
gate = []

[dependencies]
# miniframework lives in the sibling repo C:\github\microcontroller.
miniframework = { path = "../../microcontroller/miniframework/crates/miniframework", default-features = false, features = ["gzip", "session", "oauth", "ops", "rate-limit"] }
log = "0.4"
sha2 = { version = "0.10", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
crc32fast = "1.4"
getrandom = "0.2"

# Direct dependency so this crate's build script receives ESP-IDF's link
# arguments.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "=0.52.1", optional = true, features = ["experimental"] }

[build-dependencies]
# Rasterizes fonts/*.ttf into glyph atlases for the screen (build time only).
fontdue = "0.9"
embuild = { version = "0.33", optional = true, features = ["espidf"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
proptest = "1"

[package.metadata.esp-idf-sys]
esp_idf_version = "v5.5.3"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }
bindings_header = "src/mdns_bindings.h"

# The board's screen (JD9853), drawn in strips from `src/screen`.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/display"]
bindings_header = "components/display/include/ml_display.h"
